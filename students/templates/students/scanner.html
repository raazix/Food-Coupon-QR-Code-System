<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Coupon Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <div class="max-w-md mx-auto px-4 py-6">

    <h1 class="text-2xl font-bold text-center text-gray-800 mb-1">Food Coupon Scanner</h1>
    <p class="text-center text-gray-400 text-sm mb-5">College Fest — Lunch 12:15 to 1:00 PM</p>

    <!-- Tab switcher -->
    <div class="flex rounded-xl overflow-hidden border border-gray-200 mb-5 bg-white">
      <button id="tab-scan" onclick="switchTab('scan')"
        class="flex-1 py-3 text-sm font-semibold transition-colors bg-indigo-600 text-white">
        Scan QR Code
      </button>
      <button id="tab-usn" onclick="switchTab('usn')"
        class="flex-1 py-3 text-sm font-semibold transition-colors text-gray-500 hover:bg-gray-50">
        Enter USN
      </button>
    </div>

    <!-- QR Scanner panel -->
    <div id="panel-scan">
      <div id="reader" class="rounded-xl overflow-hidden shadow bg-white"></div>
    </div>

    <!-- USN manual entry panel -->
    <div id="panel-usn" class="hidden">
      <div class="bg-white rounded-2xl shadow p-6">
        <label class="block text-sm font-medium text-gray-600 mb-2">Student USN</label>
        <input id="usn-input" type="text" placeholder="e.g. 1SI21CS045"
          class="w-full border border-gray-300 rounded-xl px-4 py-3 text-lg uppercase tracking-widest
                 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent"
          maxlength="12" autocomplete="off" autocorrect="off" spellcheck="false"/>
        <button onclick="submitUSN()"
          class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800
                 text-white font-semibold py-3 rounded-xl text-base transition-colors">
          Verify &amp; Issue Coupon
        </button>
        <p class="text-xs text-gray-400 text-center mt-3">USN is unique — one entry per student</p>
      </div>
    </div>

    <!-- Result display (shared between both modes) -->
    <div id="result" class="mt-5"></div>

    <div class="mt-4 text-center">
      <a href="/api/stats/" target="_blank" class="text-xs text-gray-300 underline">Live stats</a>
    </div>

  </div>

  <script>
    // ── Tab switching ──────────────────────────────────────────
    let scannerStarted = false;
    let scanner = null;

    function switchTab(tab) {
      const isScan = tab === 'scan';

      document.getElementById('panel-scan').classList.toggle('hidden', !isScan);
      document.getElementById('panel-usn').classList.toggle('hidden', isScan);

      document.getElementById('tab-scan').className =
        'flex-1 py-3 text-sm font-semibold transition-colors ' +
        (isScan ? 'bg-indigo-600 text-white' : 'text-gray-500 hover:bg-gray-50');

      document.getElementById('tab-usn').className =
        'flex-1 py-3 text-sm font-semibold transition-colors ' +
        (!isScan ? 'bg-indigo-600 text-white' : 'text-gray-500 hover:bg-gray-50');

      if (isScan && !scannerStarted) {
        startScanner();
      }

      if (!isScan) {
        setTimeout(() => document.getElementById('usn-input').focus(), 100);
      }

      document.getElementById('result').innerHTML = '';
    }

    // ── QR Scanner ─────────────────────────────────────────────
    let lastQR = '';
    let lastTime = 0;
    const DEBOUNCE_MS = 3000;

    function startScanner() {
      scannerStarted = true;
      scanner = new Html5QrcodeScanner('reader', {
        fps: 10,
        qrbox: { width: 260, height: 260 },
        rememberLastUsedCamera: true,
      });
      scanner.render((text) => {
        const now = Date.now();
        if (text === lastQR && now - lastTime < DEBOUNCE_MS) return;
        lastQR = text;
        lastTime = now;
        callVerifyAPI({ qr_id: text });
      }, console.error);
    }

    // Start scanner immediately on load
    startScanner();

    // ── USN manual entry ───────────────────────────────────────
    document.getElementById('usn-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitUSN();
    });

    function submitUSN() {
      const usn = document.getElementById('usn-input').value.trim().toUpperCase();
      if (!usn) {
        showError('Please enter a USN');
        return;
      }
      callVerifyAPI({ usn: usn });
    }

    // ── Shared API call ────────────────────────────────────────
    function callVerifyAPI(payload) {
      fetch('/api/verify/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      })
      .then(r => r.json())
      .then(data => {
        showResult(data);
        if (document.getElementById('panel-usn').classList.contains('hidden') === false) {
          document.getElementById('usn-input').value = '';
          setTimeout(() => document.getElementById('usn-input').focus(), 200);
        }
      })
      .catch(() => showError('Network error — check Wi-Fi connection'));
    }

    // ── Result display ─────────────────────────────────────────
    function showResult(data) {
      const el = document.getElementById('result');
      if (data.status === 'allowed') {
        const isVeg = data.food === 'Veg';
        el.innerHTML = `
          <div class="border-2 rounded-2xl p-5 text-center
            ${isVeg ? 'bg-green-50 border-green-400 text-green-900' : 'bg-orange-50 border-orange-400 text-orange-900'}">
            <div class="text-5xl mb-2">${isVeg ? '🥦' : '🍗'}</div>
            <div class="text-green-600 font-bold text-lg mb-1">✅ Allowed</div>
            <div class="text-2xl font-bold">${data.name}</div>
            <div class="text-sm mt-1 opacity-60">${data.usn} &bull; ${data.section}</div>
            <div class="mt-3 inline-block px-5 py-1 rounded-full text-white font-semibold text-lg
              ${isVeg ? 'bg-green-500' : 'bg-orange-500'}">
              ${data.food}
            </div>
          </div>`;
      } else if (data.status === 'rejected') {
        el.innerHTML = `
          <div class="border-2 rounded-2xl p-5 text-center bg-red-50 border-red-400 text-red-900">
            <div class="text-5xl mb-2">🚫</div>
            <div class="text-xl font-bold">Already Used!</div>
            <div class="text-sm mt-1 opacity-70">${data.name} — ${data.usn}</div>
          </div>`;
      } else if (data.status === 'invalid') {
        el.innerHTML = `
          <div class="border-2 rounded-2xl p-5 text-center bg-yellow-50 border-yellow-400 text-yellow-900">
            <div class="text-5xl mb-2">❓</div>
            <div class="text-xl font-bold">Not Found</div>
            <div class="text-sm mt-2 opacity-70">${data.message || 'USN or QR not in the system'}</div>
          </div>`;
      } else {
        showError(data.message || 'Something went wrong');
      }
      setTimeout(() => { el.innerHTML = ''; }, 5000);
    }

    function showError(msg) {
      const el = document.getElementById('result');
      el.innerHTML = `
        <div class="border-2 rounded-2xl p-4 text-center bg-red-50 border-red-300 text-red-700">
          ${msg}
        </div>`;
      setTimeout(() => { el.innerHTML = ''; }, 4000);
    }
  </script>
</body>
</html>
