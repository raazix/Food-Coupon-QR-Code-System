<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vigam'26 | Food Pass</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: {
            college: {
              black: '#0a0a0a',
              dark: '#141414',
              blood: '#9e1b1b',
              neon: '#ff2a3f'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Outfit', sans-serif; background-color: #050505; color: white; }
    .glass { background: rgba(20, 20, 20, 0.7); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow-red { box-shadow: 0 0 20px rgba(255, 42, 63, 0.2); border: 1px solid rgba(255, 42, 63, 0.2); }
    .glow-red:focus-within { box-shadow: 0 0 35px rgba(255, 42, 63, 0.4); border: 1px solid rgba(255, 42, 63, 0.6); }
    .tab-active { background: linear-gradient(135deg, #9e1b1b 0%, #ff2a3f 100%); color: white; box-shadow: 0 5px 20px rgba(255, 42, 63, 0.5); border-color: transparent!important; }
    .tab-inactive { background: #111; color: #777; border-color: #222!important; }
    
    /* Overriding HTML5 QR Code styles to match dark mode */
    #reader { border: none !important; }
    #reader__dashboard_section_csr span { color: #999 !important; }
    #reader__dashboard_section_swaplink { color: #ff2a3f !important; text-decoration: none !important; }
    #reader__dashboard_section_csr button { background: linear-gradient(135deg, #9e1b1b 0%, #ff2a3f 100%) !important; color: white !important; border: none !important; border-radius: 8px !important; padding: 6px 16px !important; font-family: 'Outfit' !important; font-weight: bold!important; }
    #reader__status_span { color: #ff2a3f !important; }
    #reader__scan_region img { filter: invert(1); opacity: 0.2; }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-[url('https://images.unsplash.com/photo-1459749411175-04bf5292ceea?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80')] bg-cover bg-center bg-fixed relative">
    
    <!-- Creative Deep Red/Black Overlay -->
    <div class="fixed inset-0 bg-gradient-to-br from-[#050505] via-[#050505]/90 to-[#9e1b1b]/30 backdrop-blur-[4px] z-0"></div>
    
    <div class="z-10 w-full max-w-md relative">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-block px-3 py-1 bg-college-blood/30 border border-college-neon/40 text-college-neon rounded-full text-xs font-bold uppercase tracking-widest mb-3">Live Feed Actvated</div>
            <h1 class="text-4xl font-extrabold text-white tracking-tight drop-shadow-xl">FOOD<span class="text-college-neon">PASS</span></h1>
            <p class="text-gray-400 text-sm mt-1 uppercase tracking-widest">Vigam'26</p>
        </div>

        <!-- Tab Switcher -->
        <div class="flex gap-2 mb-6">
            <button id="tab-scan" onclick="switchTab('scan')" class="flex-1 py-3.5 px-4 rounded-xl text-sm font-bold transition-all duration-300 tab-active border border-transparent uppercase tracking-wider">
                Scanner
            </button>
            <button id="tab-usn" onclick="switchTab('usn')" class="flex-1 py-3.5 px-4 rounded-xl text-sm font-bold transition-all duration-300 tab-inactive border uppercase tracking-wider">
                USN Entry
            </button>
        </div>

        <!-- Scanner Panel -->
        <div id="panel-scan" class="glass rounded-2xl p-3 glow-red transition-all duration-500 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 w-full h-1 bg-gradient-to-r from-transparent via-college-neon to-transparent opacity-50 left-0"></div>
            <div class="rounded-xl overflow-hidden bg-college-black border-2 border-college-dark">
                <div id="reader" class="w-full"></div>
            </div>
            <div class="mt-4 text-center text-xs font-bold text-gray-500 uppercase tracking-widest pb-1 opacity-70">Point scanner at QR Code</div>
        </div>

        <!-- USN Panel -->
        <div id="panel-usn" class="hidden glass rounded-2xl p-6 glow-red transition-all duration-500 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 w-full h-1 bg-gradient-to-r from-transparent via-college-neon to-transparent opacity-50 left-0"></div>
            <h3 class="text-gray-300 font-bold text-sm tracking-widest uppercase mb-4 text-center">Manual Authorization</h3>
            <input id="usn-input" type="text" placeholder="USN ID" 
                class="w-full bg-[#080808] border-2 border-gray-800 rounded-xl px-5 py-4 text-2xl font-bold text-white uppercase tracking-widest text-center focus:outline-none focus:border-college-neon focus:ring-0 transition-colors placeholder-gray-800"
                maxlength="12" autocomplete="off" autocorrect="off" spellcheck="false"/>
            
            <button onclick="submitUSN()" 
                    class="w-full mt-5 bg-gradient-to-r from-[#8a1414] to-college-neon hover:to-red-500 active:scale-95 text-white font-bold py-4 rounded-xl shadow-lg shadow-college-neon/30 transition-all duration-200 uppercase tracking-widest">
                Authorize
            </button>
        </div>

        <!-- Result Container -->
        <div id="result" class="mt-8 transition-all duration-500"></div>

        <div class="mt-10 text-center">
            <a href="/api/stats/" target="_blank" class="text-xs text-gray-600 hover:text-college-neon transition-colors tracking-widest uppercase font-bold">MINDS</a>
        </div>
    </div>

    <script>
        let scannerStarted = false;
        let scanner = null;

        function switchTab(tab) {
            const isScan = tab === 'scan';
            document.getElementById('panel-scan').classList.toggle('hidden', !isScan);
            document.getElementById('panel-usn').classList.toggle('hidden', isScan);

            const tabScan = document.getElementById('tab-scan');
            const tabUsn = document.getElementById('tab-usn');

            if (isScan) {
                tabScan.classList.replace('tab-inactive', 'tab-active');
                tabUsn.classList.replace('tab-active', 'tab-inactive');
                if (!scannerStarted) startScanner();
            } else {
                tabUsn.classList.replace('tab-inactive', 'tab-active');
                tabScan.classList.replace('tab-active', 'tab-inactive');
                setTimeout(() => document.getElementById('usn-input').focus(), 100);
            }
            document.getElementById('result').innerHTML = '';
        }

        let lastQR = '';
        let lastTime = 0;
        const DEBOUNCE_MS = 3000;

        function startScanner() {
            scannerStarted = true;
            scanner = new Html5QrcodeScanner('reader', {
                fps: 10,
                qrbox: { width: 230, height: 230 },
                rememberLastUsedCamera: true,
            });
            scanner.render((text) => {
                const now = Date.now();
                if (text === lastQR && now - lastTime < DEBOUNCE_MS) return;
                lastQR = text;
                lastTime = now;
                
                // Show analyzing state
                const el = document.getElementById('result');
                el.innerHTML = '<div class="glass border border-college-neon rounded-2xl p-4 text-center text-white font-bold animate-pulse shadow-lg shadow-college-neon/20 uppercase tracking-widest text-sm">Authorizing...</div>';
                
                callVerifyAPI({ qr_id: text });
            }, console.error);
        }

        startScanner();

        document.getElementById('usn-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitUSN();
        });

        function submitUSN() {
            const usn = document.getElementById('usn-input').value.trim().toUpperCase();
            if (!usn) return showError('USN REQUIRED');
            callVerifyAPI({ usn: usn });
        }

        function callVerifyAPI(payload) {
            fetch('/api/verify/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-Verify-Token': '{{ verify_token }}'
                },
                body: JSON.stringify(payload),
            })
            .then(r => r.json())
            .then(data => {
                showResult(data);
                if (!document.getElementById('panel-usn').classList.contains('hidden')) {
                    document.getElementById('usn-input').value = '';
                    setTimeout(() => document.getElementById('usn-input').focus(), 200);
                }
            })
            .catch(() => showError('SYSTEM OFFLINE'));
        }

        function showResult(data) {
            const el = document.getElementById('result');
            let content = '';

            if (data.status === 'allowed') {
                const isVeg = data.food === 'Veg';
                content = `
                <div class="glass border-2 ${isVeg ? 'border-green-500 shadow-green-500/20' : 'border-orange-500 shadow-orange-500/20'} rounded-2xl p-6 text-center animate-[bounce_0.5s_ease-out] relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-2 opacity-10">
                        <svg class="w-24 h-24" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                    </div>
                    <div class="text-6xl mb-3 drop-shadow-md pb-2">${isVeg ? '🥦' : '🍗'}</div>
                    <div class="text-white font-extrabold text-2xl tracking-tight leading-tight">${data.name}</div>
                    <div class="text-gray-400 text-sm mt-1 uppercase tracking-widest">${data.usn} &bull; SEC ${data.section}</div>
                    <div class="mt-5 py-2 w-full inline-block rounded-xl font-black tracking-widest uppercase shadow-lg border border-opacity-30
                        ${isVeg ? 'bg-[#0a2e15] border-green-400 text-green-400 shadow-green-900' : 'bg-[#3b1a0a] border-orange-400 text-orange-400 shadow-orange-900'}">
                        ${data.food} VERIFIED
                    </div>
                </div>`;
            } else if (data.status === 'rejected') {
                content = `
                <div class="glass border-2 border-college-neon rounded-2xl p-6 text-center animate-[pulse_0.4s_ease-out] relative">
                    <div class="text-6xl mb-3 drop-shadow-md">🛑</div>
                    <div class="text-college-neon font-black text-2xl uppercase tracking-widest mb-1">Pass void</div>
                    <div class="text-white font-bold">${data.name}</div>
                    <div class="text-red-400 text-sm mt-1 uppercase tracking-widest">${data.usn}</div>
                    <div class="mt-5 py-2 w-full inline-block rounded-xl font-black tracking-widest uppercase bg-red-950 text-red-400 border border-red-500/50 shadow-[inset_0_0_15px_rgba(255,0,0,0.3)]">
                        ALREADY SCANNED
                    </div>
                </div>`;
            } else if (data.status === 'invalid') {
                content = `
                <div class="glass border-2 border-yellow-600 rounded-2xl p-6 text-center shadow-lg shadow-yellow-600/10">
                    <div class="text-5xl mb-3">⚠️</div>
                    <div class="text-yellow-500 font-black text-xl uppercase tracking-widest mb-1">DENIED</div>
                    <div class="text-gray-400 text-sm tracking-widest uppercase">${data.message || 'Entity not found'}</div>
                </div>`;
            } else {
                content = `<div class="glass border border-gray-600 rounded-2xl p-4 text-center text-red-500 font-bold uppercase tracking-widest">${data.message || 'Error occurred'}</div>`;
            }
            
            el.innerHTML = content;
        }

        function showError(msg) {
            const el = document.getElementById('result');
            el.innerHTML = `<div class="glass border border-red-500/50 rounded-xl p-4 text-center text-college-neon font-black uppercase tracking-widest animate-pulse shadow-lg shadow-red-500/20 bg-red-950/40">${msg}</div>`;
        }
    </script>
</body>
</html>
