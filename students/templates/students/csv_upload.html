<!DOCTYPE html>
<html>
<head>
    <title>Import Students CSV</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Import Students</h1>
        <p class="text-gray-500 text-sm mb-6">
            Upload your Google Sheets CSV. Columns required: 
            <code class="bg-gray-100 px-1 rounded">Name, USN, Section, Food, Email</code>
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-4 rounded-xl 
                    {% if message.tags == 'success' %}bg-green-50 border border-green-300 text-green-800
                    {% else %}bg-red-50 border border-red-300 text-red-800{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center mb-4">
                <input type="file" name="csv_file" accept=".csv" class="w-full text-sm text-gray-500"/>
                <p class="text-xs text-gray-400 mt-2">Only .csv files accepted</p>
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-colors">
                Upload &amp; Import
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="/admin/students/student/" class="text-sm text-indigo-500 hover:underline">&larr; Back to Student list</a>
        </div>
    </div>
</body>
</html>
